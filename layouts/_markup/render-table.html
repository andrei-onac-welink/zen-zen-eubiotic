<div class="overflow-x-auto w-full border border-gray-300 rounded-xl break-normal">
  <table class="w-full divide-y divide-gray-300"
    {{- range $k, $v := .Attributes }}
      {{- if $v }}
        {{- printf " %s=%q" $k $v | safeHTMLAttr }}
      {{- end }}
    {{- end }}>
    <thead class="bg-neutral-200 text-slate-800">
      {{- range .THead }}
        <tr class="divide-x divide-gray-300">
          {{- range . }}
            <th class="px-4 py-2 align-middle"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
            {{- .Text -}}
            </th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody class="divide-y divide-gray-300 bg-white text-slate-800">
      {{- range .TBody }}
        <tr class="divide-x divide-gray-300 even:bg-gray-50">
          {{- range . }}
            <td class="px-4 py-2 align-middle"
              {{- with .Alignment }}
                {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
              {{- end -}}
            >
            {{- .Text -}}
            </td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
