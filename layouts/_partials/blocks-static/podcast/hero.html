<section class="relative isolate overflow-hidden bg-white pt-32 lg:pt-36" id="top" aria-labelledby="podcast-title">
  <span class="absolute -left-20 top-28 -z-10 size-64 rounded-full bg-primary-100 lg:-left-16 lg:top-32 lg:size-72" aria-hidden="true"></span>
  <span class="absolute left-[10%] top-6 -z-10 size-28 rounded-full bg-primary-50 lg:left-[10%] lg:size-36" aria-hidden="true"></span>
  <span class="absolute right-[-5rem] top-40 -z-10 size-64 rounded-full bg-primary-50 lg:right-[-3rem] lg:size-72" aria-hidden="true"></span>

  <header class="container text-center">
    <h1 class="text-3xl font-bold uppercase leading-tight text-primary-500 lg:text-6xl text-pretty" id="podcast-title">{{ .title | default .page.Title }}</h1>
    {{- with .description -}}
      <p class="mx-auto mt-4 max-w-5xl text-xl font-bold leading-tight text-secondary-800 lg:text-3xl">{{ . }}</p>
    {{- end -}}
  </header>
</section>
