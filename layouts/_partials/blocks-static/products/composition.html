{{- $imagePath := partial "components/image-resource" (dict "page" .page "name" .image) -}}

<section class="bg-primary-50 pb-16 lg:pb-24" aria-label="{{ .ariaLabel | default "Compoziția produsului" }}">
  <div class="container grid items-start gap-10 lg:grid-cols-2 lg:gap-14">
    <div class="space-y-5 text-base leading-7 text-secondary-800">
      {{- range .paragraphs -}}
        <p>{{ . | safeHTML }}</p>
      {{- end -}}
    </div>

    {{- if $imagePath -}}
      <figure>
        {{ partial "components/image-responsive" (dict
          "path" $imagePath
          "class" "mx-auto w-full object-contain"
          "loading" "lazy"
          "fetchPriority" "auto"
          "alt" .alt
          "format" "webp"
          "quality" 88
          "widths" (slice 480 720 960)
          "sizes" "(max-width: 1023px) 100vw, 50vw"
        ) }}
        {{- with .caption -}}
          <figcaption class="mt-5 text-center text-base font-semibold text-primary-500">{{ . | safeHTML }}</figcaption>
        {{- end -}}
      </figure>
    {{- end -}}
  </div>
</section>
