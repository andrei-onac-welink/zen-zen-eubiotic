<section class="bg-white py-16 lg:py-24" aria-labelledby="ingredients-title">
  <div class="container">
    <h2 class="text-2xl font-bold text-primary-500 lg:text-3xl" id="ingredients-title">{{ .title | safeHTML }}</h2>
    {{- with .subtitle -}}
      <h3 class="mt-4 text-xl font-bold text-primary-500 lg:text-2xl">{{ . | safeHTML }}</h3>
    {{- end -}}

    <div class="mt-5 space-y-5 text-base leading-7 text-secondary-800">
      {{- range .paragraphs -}}
        <p>{{ . | safeHTML }}</p>
      {{- end -}}
    </div>
  </div>
</section>
