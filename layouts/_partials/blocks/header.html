<header class="site-header group | fixed inset-x-0 top-0 z-50 bg-linear-to-b from-black/45 via-black/15 to-transparent text-white [--header-height:70px] transition-[background-color,background-image,box-shadow,color,backdrop-filter] duration-300 data-[scrolled=true]:bg-white/95 data-[scrolled=true]:bg-none data-[scrolled=true]:text-[#4d4d4d] data-[scrolled=true]:shadow-lg data-[scrolled=true]:backdrop-blur-md lg:[--header-height:110px] data-[scrolled=true]:[--header-height:56px] lg:data-[scrolled=true]:[--header-height:64px]" data-scrolled="false">
  <div class="flex h-[var(--header-height)] w-full items-center justify-between px-4 transition-[height] duration-300 sm:px-8 lg:px-6 xl:px-10">
    <a class="relative z-20 block w-[118px] shrink-0 transition-[width] duration-300 group-data-[scrolled=true]:w-[100px] lg:w-[132px] lg:group-data-[scrolled=true]:w-[108px]" href="{{ site.Home.RelPermalink }}" aria-label="Eubiotic - Acasă" draggable="false">
      <img class="block h-auto w-full brightness-0 invert transition-[filter] duration-300 group-data-[scrolled=true]:brightness-100 group-data-[scrolled=true]:invert-0" src="https://www.eubiotic.ro/wp-content/uploads/logo-eubiotic.svg" width="470" height="92" alt="Eubiotic" fetchpriority="high" draggable="false" />
    </a>

    <input class="nav-toggle | peer sr-only" type="checkbox" id="site-navigation-toggle" aria-controls="site-navigation" />
    <label class="relative z-20 grid size-10 cursor-pointer place-items-center lg:hidden" for="site-navigation-toggle">
      <span class="sr-only bg-black text-white">Deschide meniul</span>
      <svg class="size-6" aria-hidden="true" focusable="false"><use href="#menu-icon"></use></svg>
    </label>

    <nav class="fixed inset-x-0 top-[var(--header-height)] z-10 h-[calc(100svh-var(--header-height))] translate-x-full overflow-y-auto bg-white px-6 py-10 text-[#4d4d4d] transition-[top,height,transform] duration-300 peer-checked:translate-x-0 lg:static lg:h-auto lg:translate-x-0 lg:overflow-visible lg:bg-transparent lg:p-0 lg:text-white lg:group-data-[scrolled=true]:text-[#4d4d4d]" id="site-navigation" aria-label="Navigație principală">
      <menu class="m-0 flex list-none flex-col items-center gap-7 p-0 lg:flex-row lg:gap-6 xl:gap-8">
        {{ range site.Menus.main }}
          <li>
            <a class="block text-center text-base font-bold uppercase tracking-wide transition hover:text-primary-500 aria-current:text-primary-500 lg:hover:text-primary-300 lg:aria-current:text-primary-300 lg:group-data-[scrolled=true]:hover:text-primary-500 lg:group-data-[scrolled=true]:aria-current:text-primary-500" href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}aria-current="page"{{ end }} draggable="false">{{ .Name }}</a>
          </li>
        {{ end }}
      </menu>
    </nav>
  </div>
</header>
