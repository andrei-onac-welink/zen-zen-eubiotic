<section class="relative isolate flex min-h-[48rem] items-center justify-center overflow-hidden bg-primary-500 px-5 pb-20 pt-28 text-center text-white sm:px-8 md:min-h-lvh lg:pb-28 lg:pt-36" id="top" aria-labelledby="error-title">
  <span class="absolute -right-72 top-1/2 -z-10 hidden size-[52rem] -translate-y-1/2 rounded-full opacity-25 lg:block" style="background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 4px,transparent 4.5px);background-size:24px 24px;mask-image:radial-gradient(circle,black 0 38%,rgba(0,0,0,.9) 52%,transparent 76%);-webkit-mask-image:radial-gradient(circle,black 0 38%,rgba(0,0,0,.9) 52%,transparent 76%)" aria-hidden="true"></span>

  <div class="relative z-10 mx-auto flex max-w-xl flex-col items-center">
    <p class="text-7xl font-bold leading-none sm:text-8xl" aria-hidden="true">404</p>
    <h1 class="mt-6 text-3xl font-bold sm:text-4xl" id="error-title">{{ .title }}</h1>
    <p class="mt-6 max-w-md text-base leading-6 sm:text-lg">{{ .description }}</p>
    <a class="mt-8 inline-flex min-w-36 items-center justify-center rounded-full bg-secondary-600 px-7 py-3 text-base font-bold text-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:bg-secondary-800 hover:shadow-lg" href="{{ site.Home.RelPermalink }}" draggable="false">{{ .ctaLabel }}</a>
  </div>
</section>
